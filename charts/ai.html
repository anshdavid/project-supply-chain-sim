<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>QUAESTOR – vis-timeline from Simulation Log</title>
    <!-- vis-timeline CSS -->
    <link href="https://unpkg.com/vis-timeline/styles/vis-timeline-graph2d.min.css" rel="stylesheet" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            height: 100%;
            font-family: sans-serif
        }

        #header {
            text-align: center;
            padding: 12px;
            background: #f5f5f5;
            border-bottom: 1px solid #ddd;
        }

        #controls {
            text-align: center;
            margin: 8px 0;
        }

        #timeline {
            height: calc(100% - 100px);
            /* leave room for header + controls */
        }

        /* Always show axis labels & tick lines */
        .vis-time-axis .vis-text {
            fill: #333 !important;
        }

        .vis-time-axis .vis-grid.vis-vertical {
            stroke: #ccc !important;
            stroke-width: 1;
        }
    </style>
</head>

<body>

    <div id="header">
        <h1>QUAESTOR</h1>
    </div>

    <div id="controls">
        <label>Upload Log File:
            <input type="file" id="fileInput" accept=".json" />
        </label>
        <span id="fileName" style="margin-left:8px;color:#666"></span>
    </div>

    <div id="timeline"></div>

    <!-- vis-timeline JS -->
    <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script>
        (function () {
            const container = document.getElementById('timeline');
            const fileInput = document.getElementById('fileInput');
            const fileNameSpan = document.getElementById('fileName');
            let timeline = null;

            // Parse your simulation-log JSON into the "tree" shape:
            function parseLog(log) {
                const factories = [];
                for (const [fname, flogs] of Object.entries(log.factory_logs || {})) {
                    const factory = {
                        id: fname,
                        name: fname,
                        markers: (flogs || [])
                            .filter(e => e.type_ === "Event")
                            .map((e, i) => ({
                                value: new Date(e.timestamp).toISOString(),
                                type: "diamond",
                                fill: "#ffa000",
                                message: e.message
                            })),
                        periods: [],
                        children: []
                    };
                    // machines
                    for (const [mname, mlogs] of Object.entries(log.machine_logs || {})) {
                        const machine = {
                            id: mname,
                            name: mname,
                            markers: (mlogs || [])
                                .filter(e => e.type_ === "Event")
                                .map(e => ({
                                    value: new Date(e.timestamp).toISOString(),
                                    type: "circle",
                                    fill: "#4fa9f6",
                                    message: e.message
                                })),
                            periods: (mlogs || [])
                                .filter(e => e.type_ === "Task" && e.duration > 0)
                                .map((e, i) => ({
                                    id: `${mname}_t${i}`,
                                    start: new Date(e.timestamp).toISOString(),
                                    end: new Date(e.timestamp + e.duration * 1000).toISOString(),
                                    message: e.message
                                }))
                        };
                        factory.children.push(machine);
                    }
                    // repairmen
                    for (const [rname, rlogs] of Object.entries(log.repairman_logs || {})) {
                        const repair = {
                            id: rname,
                            name: rname,
                            markers: (rlogs || [])
                                .filter(e => e.type_ === "Event")
                                .map(e => ({
                                    value: new Date(e.timestamp).toISOString(),
                                    type: "cross",
                                    fill: "#d32f2f",
                                    message: e.message
                                })),
                            periods: (rlogs || [])
                                .filter(e => e.type_ === "Task" && e.duration > 0)
                                .map((e, i) => ({
                                    id: `${rname}_t${i}`,
                                    start: new Date(e.timestamp).toISOString(),
                                    end: new Date(e.timestamp + e.duration * 1000).toISOString(),
                                    message: e.message
                                }))
                        };
                        factory.children.push(repair);
                    }
                    factories.push(factory);
                }
                return factories;
            }

            // Flatten the tree into vis-groups & vis-items,
            // but only draw top-level (factory) markers:
            function buildVisData(tree, depth = 0, groups = [], items = []) {
                tree.forEach(node => {
                    groups.push({
                        id: node.id,
                        content: '&nbsp;'.repeat(depth * 4) + node.name
                    });
                    // periods → range bars
                    (node.periods || []).forEach(p => {
                        items.push({
                            id: p.id,
                            group: node.id,
                            start: p.start,
                            end: p.end,
                            type: 'range',
                            content: '',
                            title: p.message  // browser tooltip
                        });
                    });
                    // markers only at root depth
                    if (depth === 0) {
                        (node.markers || []).forEach((m, i) => {
                            let symbol = '●';
                            if (m.type === 'diamond') symbol = '♦';
                            else if (m.type === 'cross') symbol = '✖';
                            else if (m.type === 'circle') symbol = '●';
                            items.push({
                                id: node.id + '_m' + i,
                                group: node.id,
                                start: m.value,
                                type: 'point',
                                content: symbol,
                                className: m.type,
                                style: `color:${m.fill}`,
                                title: m.message   // browser tooltip
                            });
                        });
                    }
                    if (node.children) {
                        buildVisData(node.children, depth + 1, groups, items);
                    }
                });
                return { groups, items };
            }

            // Choose appropriate axis granularity on zoom/pan
            function chooseTimeAxisConfig({ start, end }) {
                const span = end - start;
                if (span > 1000 * 60 * 60 * 24 * 365) return { scale: 'year', step: 1 };
                else if (span > 1000 * 60 * 60 * 24 * 30) return { scale: 'month', step: 1 };
                else if (span > 1000 * 60 * 60 * 24) return { scale: 'day', step: 1 };
                else if (span > 1000 * 60 * 60) return { scale: 'hour', step: 1 };
                else if (span > 1000 * 60) return { scale: 'minute', step: 1 };
                else return { scale: 'second', step: 1 };
            }

            // (Re)draw timeline from parsed tree
            function draw(treeData) {
                const { groups, items } = buildVisData(treeData);
                const visGroups = new vis.DataSet(groups);
                const visItems = new vis.DataSet(items);

                if (timeline) timeline.destroy();
                timeline = new vis.Timeline(container, visItems, visGroups, {
                    stack: true,
                    verticalScroll: true,
                    horizontalScroll: true,
                    zoomable: true,
                    moveable: true,
                    zoomKey: 'ctrlKey',
                    zoomMin: 1000,                // 1 s
                    zoomMax: 1000 * 60 * 60 * 24 * 365,   // ~1 yr
                    orientation: { axis: 'bottom' },
                    margin: { item: 5, axis: 2 },
                    showMajorLabels: true,
                    showMinorLabels: true,
                    timeAxis: { scale: 'minute', step: 1 }
                });

                timeline.on('rangechanged', props => {
                    timeline.setOptions({ timeAxis: chooseTimeAxisConfig(props) });
                });
            }

            // Handle file upload
            fileInput.addEventListener('change', async e => {
                const file = e.target.files[0];
                if (!file) return;
                fileNameSpan.textContent = file.name;
                const text = await file.text();
                try {
                    const log = JSON.parse(text);
                    const tree = parseLog(log);
                    draw(tree);
                } catch (err) {
                    alert('Failed to parse JSON: ' + err.message);
                }
            });

            // initial prompt
            container.innerHTML = '<div style="padding:20px; color:#888; text-align:center;">Please upload your simulation log JSON</div>';
        })();
    </script>
</body>

</html>
