<html>

<head>
    <title>Multiple JavaScript Timeline Charts</title>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-timeline.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        .timeline-container {
            width: 100%;
            height: 400px;
            margin-bottom: 40px;
        }
    </style>
</head>

<body>
    <div id="container1" class="timeline-container"></div>
    <div id="container2" class="timeline-container"></div>
    <div id="container3" class="timeline-container"></div>

    <script>
        function rangeData() {
            return [
                { name: "Childhood and Education", start: "1971/06/28", end: "1995/09/01" },
                { name: "Entrepreneur Journey", start: "1983/06/28", end: "2002/03/13" },
                { name: "Making of Tycoon", start: "2002/03/14", end: "2010/06/28" },
                { name: "Rise of Tycoon", start: "2010/06/29", end: "2030/01/01" }
            ];
        }

        function momentData() {
            return [
                ["1971/06/28", "Elon Musk was born in South Africa"],
                ["1983/06/28", "Sold the code of his game Blastar for $500"],
                ["1990/09/01", "Entered Queen's University in Kingston"],
                ["1995/09/01", "Started a Ph.D. at Stanford (dropped out in 2 days)"],
                ["1999/02/01", "Sold Zip2 to Compaq"],
                ["2002/03/14", "Founded SpaceX"],
                ["2004/02/01", "Joined Tesla board as chairman"],
                ["2010/06/29", "Tesla's IPO"],
                ["2015/12/11", "Co-founded OpenAI"],
                ["2022/07/08", "Withdrew Twitter bid"]
            ];
        }

        function drawTimeline(containerId, title) {
            let chart = anychart.timeline();

            let rangeSeries = chart.range(rangeData());
            let momentSeries = chart.moment(momentData());

            rangeSeries.labels().format("{%name}");
            chart.title(title);
            chart.container(containerId);
            chart.draw();
        }

        anychart.onDocumentReady(function () {
            drawTimeline("container1", "Timeline of Elon Musk (Instance 1)");
            drawTimeline("container2", "Timeline of Elon Musk (Instance 2)");
            drawTimeline("container3", "Timeline of Elon Musk (Instance 3)");
        });
    </script>
</body>

</html>
