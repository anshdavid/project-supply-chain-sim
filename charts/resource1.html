<html>

<head>
    <title>JavaScript Resource Chart</title>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-core.min.js" type="text/javascript"></script>
    <script src="https://cdn.anychart.com/releases/8.13.0/js/anychart-gantt.min.js" type="text/javascript"></script>
    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        button {
            margin: 10px 0 0 10px;
        }

        label {
            display: inline-block;
            margin: 10px 0 0 10px;
        }

        #container {
            position: absolute;
            width: 100%;
            top: 40px;
            bottom: 0;
        }

        #zoomInButton {
            width: 53px;
        }

        #zoomOutButton {
            width: 53px;
        }
    </style>
</head>

<body>
    <div id="container"></div>
    <script>
        var chart; // declare chart in the global scope

        anychart.onDocumentReady(function () {
            var data = [
                {
                    id: "1",
                    name: "Server 1",
                    periods: [
                        { id: "1_1", start: "2018-01-05", end: "2018-01-25" },
                        { id: "1_2", start: "2018-01-28", end: "2018-02-22" },
                        { id: "1_3", start: "2018-03-03", end: "2018-03-25" }
                    ]
                },
                {
                    id: "2",
                    name: "Server 2",
                    periods: [
                        { id: "2_1", start: "2018-01-07", end: "2018-02-15" },
                        { id: "2_2", start: "2018-02-26", end: "2018-03-20" }
                    ]
                },
                {
                    id: "3",
                    name: "Server 3",
                    periods: [
                        { id: "3_1", start: "2018-01-04", end: "2018-03-25" }
                    ]
                }
            ];

            var treeData = anychart.data.tree(data, "as-tree");

            chart = anychart.ganttResource();
            chart.data(treeData);

            var periods = chart.getTimeline().periods();
            periods.normal().fill("#455a64 0.5");
            periods.selected().fill("#dd2c00");
            periods.normal().stroke("#455a64");
            periods.selected().stroke("#dd2c00");

            chart.container("container");
            chart.draw();
            chart.fitAll();

            // Mouse wheel zoom
            document.getElementById("container").addEventListener("wheel", function (e) {
                e.preventDefault();
                if (e.deltaY < 0) {
                    chart.zoomIn(1.25);
                } else {
                    chart.zoomOut(1.25);
                }
            });

            chart.splitterPosition("10%");

            // Prevent user from dragging splitter
            chart.listen("splitterChange", function (e) {
                e.preventDefault();
                chart.splitterPosition("10%");
            });
        });

        // These functions are now in the global scope
        function zoomIn() {
            if (chart) chart.zoomIn(2);
        }

        function zoomOut() {
            if (chart) chart.zoomOut(2);
        }
    </script>
</body>

</html>
