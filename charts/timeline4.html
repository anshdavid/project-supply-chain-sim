<html>

<head>
    <title>Multiple Distinct Timeline Charts</title>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-core.min.js"></script>
    <script src="https://cdn.anychart.com/releases/8.11.0/js/anychart-timeline.min.js"></script>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
        }

        .timeline-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        .timeline-container {
            width: 100%;
            height: 500px;
            margin-top: 20px;
            margin-bottom: 1px;
        }
    </style>
</head>

<body>
    <div class="timeline-scroll-wrapper">
        <div id="container1" class="timeline-container"></div>
    </div>

    <div class="timeline-scroll-wrapper">
        <div id="container2" class="timeline-container"></div>
    </div>

    <div class="timeline-scroll-wrapper">
        <div id="container3" class="timeline-container"></div>
    </div>

    <script>
        function elonRange() {
            return [
                { name: "Childhood and Education", start: "1971/06/28", end: "1995/09/01" },
                { name: "Entrepreneur Journey", start: "1983/06/28", end: "2002/03/13" },
                { name: "Making of Tycoon", start: "2002/03/14", end: "2010/06/28" },
                { name: "Rise of Tycoon", start: "2010/06/29", end: "2030/01/01" },
                { name: "Early Days", start: "1955/02/24", end: "1976/04/01" },
                { name: "Apple Era I", start: "1976/04/01", end: "1985/09/16" },
                { name: "NeXT and Pixar", start: "1985/09/17", end: "1996/12/20" },
                { name: "Apple Era II", start: "1997/01/01", end: "2011/08/24" },
                { name: "Early Education", start: "1867/11/07", end: "1891/01/01" },
                { name: "Discovery Years", start: "1891/01/01", end: "1903/12/10" },
                { name: "Nobel and Research", start: "1903/12/10", end: "1914/07/28" },
                { name: "Later Years", start: "1914/07/28", end: "1934/07/04" }
            ];
        }

        function elonMoments() {
            return [
                ["1971/06/28", "Born in South Africa"],
                ["1995/09/01", "Started PhD at Stanford (dropped out)"],
                ["1999/02/01", "Sold Zip2"],
                ["2002/03/14", "Founded SpaceX"],
                ["2010/06/29", "Tesla IPO"],
                ["2022/04/13", "Offered to buy Twitter"],
                ["1955/02/24", "Born in San Francisco"],
                ["1976/04/01", "Founded Apple"],
                ["1985/09/16", "Left Apple"],
                ["1986/01/01", "Bought Pixar"],
                ["1997/01/01", "Returned to Apple"],
                ["2007/01/09", "Launched iPhone"],
                ["2011/10/05", "Passed away"],
                ["1867/11/07", "Born in Warsaw"],
                ["1891/01/01", "Moved to Paris to study"],
                ["1898/12/26", "Discovered radium and polonium"],
                ["1903/12/10", "Won first Nobel Prize"],
                ["1911/12/10", "Won second Nobel Prize"],
                ["1934/07/04", "Died from aplastic anemia"]
            ];
        }

        function drawTimeline(containerId, title, rangeData, momentData) {
            let chart = anychart.timeline();
            let rangeSeries = chart.range(rangeData);
            let momentSeries = chart.moment(momentData);
            rangeSeries.labels().format("{%name}");
            <!-- chart.title(title); -->
            chart.container(containerId);
            chart.draw();
        }

        anychart.onDocumentReady(function () {
            drawTimeline("container1", "Elon Musk Timeline", elonRange(), elonMoments());
        });
    </script>
</body>

</html>
