<html>

<head>
    <title>Timeline | editing | Individual editable items (override)</title>

    <style>
        body,
        html {
            font-family: 'calibri';
            font-size: 11pt;
        }

        div.vis-editable,
        div.vis-editable.vis-selected {
            /* custom styling for editable items... */
        }

        div.vis-readonly,
        div.vis-readonly.vis-selected {
            /* custom styling for readonly items... */

        }

        #uploadSection {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        #fileInput {
            margin-left: 10px;
        }

        #wrapper {
            max-width: 90%;
            margin: 0 auto;
        }

        #container {
            width: 100%;
            border: 1px solid #ccc;
        }

        .progress-wrapper {
            background: white;
            width: 100%;
            height: 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 60%;
            position: absolute;
            left: 0px;
            top: 0px;
            background: #63ed63;
        }

        .progress-label {
            position: absolute;
            z-index: 1;
            padding-left: 10px;
        }
    </style>
    <!-- <link rel="stylesheet" href="https://visjs.github.io/vis-timeline/styles/vis-timeline-graph2d.css"> -->

    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.css" rel="stylesheet"
        type="text/css" />

</head>

<body>

    <div id="wrapper">
        <h1>QUAESTOR</h1>
        <div id="uploadSection">
            <label for="fileInput">Upload Log File:</label>
            <input type="file" id="fileInput" accept=".json" />
        </div>
        <div id="container">
            <div id="visualization"></div>
        </div>
    </div>


    <!-- <script src="https://visjs.github.io/vis-timeline/standalone/umd/vis-timeline-graph2d.js"></script> -->
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.js"></script>

    <script>
        document.getElementById("fileInput").addEventListener("change", function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (event) {
                let parsed;
                try {
                    parsed = JSON.parse(event.target.result);
                } catch (e) {
                    alert("Invalid JSON file.");
                    return;
                }
                // Expect parsed to be {data: [...], groups: [...]}
                if (!parsed.data || !parsed.groups) {
                    alert("JSON must have 'data' and 'groups' arrays.");
                    return;
                }

                var items = new vis.DataSet(parsed.data);
                var groups = new vis.DataSet(parsed.groups);

                var container = document.getElementById('visualization');

                var options = {
                    stack: false,
                    // stackSubgroups: false,
                    // override items
                    editable: {
                        add: false,
                        remove: false,
                        updateGroup: false,
                        updateTime: false,
                        overrideItems: false,
                    },
                    // ease of use
                    groupHeightMode: 'fixed',
                    //cluster: {
                    //    showStipes: true,
                    //},
                    // progress bar
                    //xss: {
                    //    disabled: false,
                    //    filterOptions: {
                    //        whiteList: { p: ['class', 'data-from-template'], div: 'class' },
                    //    },
                    //},
                    //visibleFrameTemplate: function (item) {
                    //    // If the item has a value, use it to create a progress bar
                    //    if (item.progress) {
                    //        console.log("item.progress");
                    //        var percentage = item.progress + '%';
                    //        // return '<div class="progress-wrapper"><div class="progress" style="width:' + percentage + '"></div></div>';
                    //        return '<div class="progress-wrapper"><div class="progress" style="width:' + percentage + '"></div><div class="progress-label">&nbsp;Completed ' + percentage + '</div></div>';
                    //        //return '<div class="progress-wrapper"><label class="progress-label">' + percentage + '<label></div>';
                    //    }
                    //
                    //}
                };

                // Clear previous timeline if any
                if (window.timeline) {
                    window.timeline.destroy();
                }
                window.timeline = new vis.Timeline(container, items, groups, options);
            };
            reader.readAsText(file);
        });


    </script>


</body>

</html>
