<html>

<head>
    <title>Timeline | editing | Individual editable items (override)</title>

    <style>
        body,
        html {
            font-family: 'calibri';
            font-size: 11pt;
        }

        div.vis-editable,
        div.vis-editable.vis-selected {
            /* custom styling for editable items... */
        }

        div.vis-readonly,
        div.vis-readonly.vis-selected {
            /* custom styling for readonly items... */

        }

        .vis-item.expected {
            background-color: rgba(255, 0, 0, 0.08);
            border-style: dashed !important;
            z-index: 0;

        }

        #uploadSection {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        #fileInput {
            margin-left: 10px;
        }

        #wrapper {
            max-width: 90%;
            margin: 0 auto;
        }

        #container {
            width: 100%;
            border: 1px solid #ccc;
        }

        .progress-wrapper {
            background: white;
            width: 100%;
            height: 18px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 60%;
            position: absolute;
            left: 0px;
            top: 0px;
            background: #63ed63;
        }

        .progress-label {
            position: absolute;
            z-index: 1;
            padding-left: 10px;
        }
    </style>
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.css" rel="stylesheet"
        type="text/css" />

</head>

<body>

    <div id="wrapper">
        <h1>QUAESTOR</h1>
        <div id="uploadSection">
            <label for="fileInput">Upload Log Files:</label>
            <input type="file" id="fileInput" accept=".json" multiple />
        </div>
        <div id="container">
        </div>
    </div>

    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.js"></script>

    <script>
        document.getElementById("fileInput").addEventListener("change", function (e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            // Remove previous visualizations
            const container = document.getElementById('container');
            container.innerHTML = '';

            // Store all timelines for syncing
            const timelines = [];

            Array.from(files).forEach((file, idx) => {
                const reader = new FileReader();
                reader.onload = function (event) {
                    let parsed;
                    try {
                        parsed = JSON.parse(event.target.result);
                    } catch (e) {
                        alert("Invalid JSON file: " + file.name);
                        return;
                    }
                    if (!parsed.data || !parsed.groups) {
                        alert("JSON must have 'data' and 'groups' arrays in " + file.name);
                        return;
                    }

                    // Create a new div for each timeline
                    const vizDiv = document.createElement('div');
                    vizDiv.id = 'visualization_' + idx;
                    vizDiv.style.marginBottom = '40px';
                    vizDiv.style.border = '1px solid #ccc';
                    vizDiv.style.background = '#fafafa';
                    vizDiv.style.minHeight = '200px';
                    container.appendChild(vizDiv);

                    // Add a label for the file
                    const label = document.createElement('div');
                    label.textContent = file.name;
                    label.style.fontWeight = 'bold';
                    label.style.margin = '8px 0';
                    vizDiv.appendChild(label);

                    // Timeline goes below the label
                    const timelineDiv = document.createElement('div');
                    timelineDiv.id = 'timeline_' + idx;
                    vizDiv.appendChild(timelineDiv);

                    var items = new vis.DataSet(parsed.data);
                    var groups = new vis.DataSet(parsed.groups);

                    var options = {
                        stack: false,
                        stackSubgroups: false,
                        editable: {
                            add: false,
                            remove: false,
                            updateGroup: false,
                            updateTime: false,
                            overrideItems: false,
                        },
                        groupHeightMode: 'fixed',
                    };

                    var timeline = new vis.Timeline(timelineDiv, items, groups, options);
                    timelines.push(timeline);

                    // Attach sync events after all timelines are created
                    if (timelines.length === files.length) {
                        let isSyncing = false;
                        function syncAllTimelines(source, s, e) {
                            if (isSyncing) return;
                            isSyncing = true;
                            timelines.forEach(tl => {
                                if (tl !== source) tl.setWindow(s, e, { animation: false });
                            });
                            isSyncing = false;
                        }
                        timelines.forEach(tl => {
                            tl.on('rangechange', function (props) {
                                syncAllTimelines(tl, props.start, props.end);
                            });
                            tl.on('rangechanged', function (props) {
                                syncAllTimelines(tl, props.start, props.end);
                            });
                        });
                    }
                };
                reader.readAsText(file);
            });
        });
    </script>


</body>

</html>
